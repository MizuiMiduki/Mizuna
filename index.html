<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Mizuna -ノート専用Misskeyクライアント</title>
  <meta name="apple-mobile-web-app-title" content="Mizuna" />
  <meta content="Mizunaは機能をノート送信のみにすることで通信量削減に重点を置いたMisskeyクライアントです" name="description" />
  <meta property="og:title" content="Mizuna - ノート専用Misskeyクライアント" />
  <meta property="og:description" content="Mizunaは機能をノート送信のみにすることで通信量削減に重点を置いた軽量Misskeyクライアントです。A lightweight Misskey client focusing on note posting to minimize network usage." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mizuna.blossomsarchive.com/" />
  <meta property="og:image" content="https://mizuna.blossomsarchive.com/icon.png" />
  <meta property="og:site_name" content="Mizuna" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:locale:alternate" content="ru_RU" />
  <meta property="og:locale:alternate" content="ko_KR" />
  <meta property="og:locale:alternate" content="zh_CN" />
  <meta name="twitter:card" content="summary" />
  <link id="mizuna-manifest-link" href="/manifest.json" rel="manifest" />
  <script>
    (function () {
      var h = location.hostname.toLowerCase();
      if (h.indexOf('canary') !== -1 || h.indexOf('test') !== -1) {
        document.title = 'Mizuna Canary -ノート専用Misskeyクライアント';
        var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleMeta) appleMeta.setAttribute('content', 'Mizuna Canary');
        var manifestLink = document.getElementById('mizuna-manifest-link');
        if (manifestLink) manifestLink.setAttribute('href', '/manifest-canary.json');
        var robotsMeta = document.createElement('meta');
        robotsMeta.name = 'robots';
        robotsMeta.content = 'noindex, nofollow';
        document.head.appendChild(robotsMeta);
      }
    })();
  </script>
  <link href="/icon.png" rel="icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="light">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
