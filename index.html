<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Mizuna -ノート専用Misskeyクライアント</title>
  <meta name="apple-mobile-web-app-title" content="Mizuna" />
  <meta content="Mizunaは機能をノート送信のみにすることで通信量削減に重点を置いたMisskeyクライアントです" name="description" />
  <link id="mizuna-manifest-link" href="/manifest.json" rel="manifest" />
  <script>
    (function () {
      var h = location.hostname.toLowerCase();
      if (h.indexOf('canary') !== -1 || h.indexOf('test') !== -1) {
        document.title = 'Mizuna Canary -ノート専用Misskeyクライアント';
        var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleMeta) appleMeta.setAttribute('content', 'Mizuna Canary');
        var manifestLink = document.getElementById('mizuna-manifest-link');
        if (manifestLink) manifestLink.setAttribute('href', '/manifest-canary.json');
      }
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (error) {
          console.error('Service Worker registration failed:', error);
        });
      });
    }
  </script>
  <link href="/icon.png" rel="icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="light">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
