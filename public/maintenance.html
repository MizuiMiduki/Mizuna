<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <title>メンテナンス | Mizuna</title>
  <link href="/icon.png" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" rel="stylesheet">

  <style>
    :root {
      --primary: #2b8cbe;
      --surface: #f8fafe;
      --surface-container-low: #ffffff;
      --on-surface: #181c20;
      --on-surface-variant: #44474f;
      --outline-variant: #c4c7d0;
      --radius-xl: 28px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #38bdf8;
        --surface: #0f141c;
        --surface-container-low: #181f2c;
        --on-surface: #e2e8f0;
        --on-surface-variant: #94a3b8;
        --outline-variant: #334155;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: "IBM Plex Sans JP", "Inter", system-ui, -apple-system, sans-serif;
      background-color: var(--surface);
      color: var(--on-surface);
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(
          800px circle at 15% -10%,
          color-mix(in srgb, var(--primary) 14%, transparent),
          transparent 70%
        ),
        radial-gradient(
          700px circle at 85% 100%,
          color-mix(in srgb, var(--primary) 10%, transparent),
          transparent 65%
        ),
        var(--surface);
    }

    .mizuna-maint-card {
      position: relative;
      text-align: center;
      background: color-mix(in srgb, var(--surface-container-low) 92%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent);
      box-shadow:
        0 24px 60px -12px rgba(0, 0, 0, 0.08),
        0 2px 8px -2px rgba(0, 0, 0, 0.04);
      border-radius: var(--radius-xl);
      padding: 44px 32px 36px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: floatIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .mizuna-logo-badge {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 24px -4px color-mix(in srgb, var(--primary) 30%, transparent);
      margin-bottom: 6px;
    }

    .mizuna-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mizuna-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .mizuna-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.75);
      }
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--on-surface);
      margin-top: 4px;
    }

    p {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--on-surface-variant);
      margin: 0;
    }

    .mizuna-divider {
      width: 100%;
      height: 1px;
      background: color-mix(in srgb, var(--outline-variant) 40%, transparent);
      margin: 10px 0 4px;
    }

    .mizuna-reload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 44px;
      padding: 0 20px;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--primary) 14%, var(--surface-container-low));
      border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
      color: var(--primary);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .mizuna-reload-btn:hover {
      background: var(--primary);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -2px color-mix(in srgb, var(--primary) 35%, transparent);
    }

    .mizuna-reload-btn i {
      font-size: 18px;
    }

    .footer {
      font-size: 0.75rem;
      color: color-mix(in srgb, var(--on-surface-variant) 70%, transparent);
      margin-top: 2px;
    }
  </style>
  <script src="https://unpkg.com/budoux/bundle/budoux-ja.min.js"></script>
</head>

<body>
  <div class="mizuna-maint-card">
    <div class="mizuna-logo-badge">
      <img alt="Mizuna" class="mizuna-logo-img" src="/icon.png">
    </div>

    <div class="mizuna-status-pill">
      <span class="mizuna-pulse-dot"></span>
      <span>SYSTEM MAINTENANCE</span>
    </div>

    <budoux-ja>
      <h1>現在メンテナンス中です</h1>
    </budoux-ja>

    <budoux-ja>
      <p>システムの更新・デプロイ作業を行っています。<br>完了次第、自動的にサービスを再開いたします。<br>恐れ入りますが、いましばらくお待ちください。</p>
    </budoux-ja>

    <div class="mizuna-divider"></div>

    <button type="button" class="mizuna-reload-btn" onclick="location.reload()">
      <i class="material-symbols-rounded">refresh</i>
      <span>状態を再確認する</span>
    </button>

    <div class="footer">
      &copy; <span id="Copyright_year"></span> Mizui Miduki · Mizuna
    </div>
  </div>

  <script>
    document.getElementById('Copyright_year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
