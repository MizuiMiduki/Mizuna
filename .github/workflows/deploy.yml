name: Deploy Release to FTP

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'デプロイ対象を選択 (release: 最新の本番リリース / prerelease: 最新のプレリリース[Canary])'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
      scheduled_time:
        description: 'デプロイ予約日時 (日本時間 JST。形式: yyyy/mm/dd hh:mm、例: 2026/10/23 15:00, 15:00, +30m。空欄の場合は現在日時で即時デプロイ)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write

jobs:
  schedule:
    name: Wait for Scheduled Time
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      is_relay: ${{ steps.schedule.outputs.is_relay }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Scheduled Deploy Time (JST)
        id: schedule
        env:
          SCHEDULE_TIME: ${{ inputs.scheduled_time }}
        run: |
          node scripts/parse-schedule.cjs

      - name: Wait until Scheduled Time (JST)
        if: steps.schedule.outputs.wait_seconds != '0'
        env:
          WAIT_SEC: ${{ steps.schedule.outputs.wait_seconds }}
        run: |
          echo "=========================================================="
          echo "🕒 デプロイ予約待機中..."
          echo "${{ steps.schedule.outputs.schedule_info }}"
          echo "=========================================================="
          REMAINING=$WAIT_SEC
          while [ "$REMAINING" -gt 0 ]; do
            if [ "$REMAINING" -gt 600 ]; then
              echo "[$(date -u)] 残り待機時間: 約 $((REMAINING / 60)) 分 ($REMAINING 秒)..."
              sleep 600
              REMAINING=$((REMAINING - 600))
            else
              echo "[$(date -u)] 残り待機時間: $REMAINING 秒..."
              sleep "$REMAINING"
              REMAINING=0
            fi
          done
          echo "=========================================================="
          echo "⏰ 待機時間が完了しました。"
          echo "=========================================================="

      - name: Relay to Next Scheduled Run
        if: steps.schedule.outputs.is_relay == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          TARGET_TIME: ${{ steps.schedule.outputs.target_jst_str }}
        run: |
          echo "=========================================================="
          echo "🔄 予約時刻までまだ時間があるため、次のワークフローへ待機を引き継ぎます。"
          echo "引き継ぎ日時 (JST): $TARGET_TIME"
          echo "対象ブランチ: $REF"
          echo "デプロイ対象: $DEPLOY_TARGET"
          echo "=========================================================="
          gh workflow run deploy.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f deploy_target="$DEPLOY_TARGET" \
            -f scheduled_time="$TARGET_TIME"
          echo "✅ 次のワークフローを起動しました。本ワークフローは完了します。"

  deploy:
    name: Deploy Release
    needs: schedule
    if: needs.schedule.outputs.is_relay != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Latest Release Tag
        id: target_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          CANARY_FTP_USER: ${{ secrets.CANARY_FTP_USERNAME }}
          CANARY_FTP_PASS: ${{ secrets.CANARY_FTP_PASSWORD }}
          PROD_FTP_USER: ${{ secrets.FTP_USERNAME }}
          PROD_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$DEPLOY_TARGET" = "prerelease" ]; then
            echo "最新のプレリリース (Canary) を検索しています..."
            TAG_NAME=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.prerelease == true and .draft == false)][0].tag_name // empty')
            FTP_USER="$CANARY_FTP_USER"
            FTP_PASS="$CANARY_FTP_PASS"
          else
            echo "最新の正式リリース (Production) を検索しています..."
            TAG_NAME=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.prerelease == false and .draft == false)][0].tag_name // empty')
            FTP_USER="$PROD_FTP_USER"
            FTP_PASS="$PROD_FTP_PASS"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "::error::対象となる '$DEPLOY_TARGET' のリリースが見つかりませんでした。先に Create Release ワークフローを実行してリリースを作成してください。"
            exit 1
          fi

          echo "デプロイ対象タグ: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "ftp_user=$FTP_USER" >> "$GITHUB_OUTPUT"
          echo "ftp_pass=$FTP_PASS" >> "$GITHUB_OUTPUT"

      - name: Checkout Release Tag
        env:
          TARGET_TAG: ${{ steps.target_release.outputs.tag_name }}
        run: |
          git checkout "$TARGET_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Build
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
        run: |
          npm ci
          if [ "$DEPLOY_TARGET" = "prerelease" ]; then
            npm run build:canary
          else
            npm run build
          fi

      # ========================================================
      # 1. メンテナンス中画面の適用 (デプロイ中の操作・破損を防止)
      # ========================================================
      - name: Prepare Maintenance Page
        run: |
          mkdir -p maintenance_staging
          cp public/maintenance.html maintenance_staging/index.html
          cp public/icon.png maintenance_staging/icon.png

      - name: Enable Maintenance Mode via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ steps.target_release.outputs.ftp_user }}
          password: ${{ steps.target_release.outputs.ftp_pass }}
          local-dir: "./maintenance_staging/"
          server-dir: "${{ secrets.FTP_TARGET_DIR }}"

      # ========================================================
      # 2. アプリ本体の差分同期 (JS, CSS, 画像などの高速転送)
      # ========================================================
      - name: Deploy dist via FTP (Differential Sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ steps.target_release.outputs.ftp_user }}
          password: ${{ steps.target_release.outputs.ftp_pass }}
          local-dir: "./dist/"
          server-dir: "${{ secrets.FTP_TARGET_DIR }}"
