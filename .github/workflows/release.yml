name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'リリースの種類 (release: 正式リリース / prerelease: プレリリース)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
      custom_version:
        description: 'バージョン番号の上書き (空欄の場合は package.json のバージョンを自動使用)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version, Tag, and Generate Changelog
        id: meta
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$CUSTOM_VERSION" ]; then
            RAW_VER="$CUSTOM_VERSION"
          else
            RAW_VER=$(node -p "require('./package.json').version")
          fi

          # 先頭に v が無ければ付与
          if [[ "$RAW_VER" == v* ]]; then
            TAG_NAME="$RAW_VER"
            VER_NUM="${RAW_VER#v}"
          else
            TAG_NAME="v$RAW_VER"
            VER_NUM="$RAW_VER"
          fi

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            # プレリリース時はタグ名に -pre を付与 (既に含まれていなければ)
            if [[ "$TAG_NAME" != *-pre* ]]; then
              TAG_NAME="${TAG_NAME}-pre"
            fi
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_title=Mizuna $TAG_NAME (Pre-release)" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_title=Mizuna $TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER_NUM" >> "$GITHUB_OUTPUT"

          # 直前のタグを取得して変更履歴を生成 (同名タグ自身は除外)
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG_NAME" 2>/dev/null || echo "")
          {
            echo "## Mizuna $TAG_NAME"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 変更内容 ($PREV_TAG からの差分)"
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)"
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG_NAME}"
            else
              echo "### 変更内容 (直近のコミット)"
              git log -n 30 --no-merges --pretty=format:"- %s (%h)"
              echo ""
            fi
          } > RELEASE_NOTES.md

          # 同名タグが既に存在する場合も現在のコミットへ上書き更新
          git tag -f "$TAG_NAME" HEAD
          git push -f origin "refs/tags/$TAG_NAME"

      - name: Create Git Tag and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
