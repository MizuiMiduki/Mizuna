name: Create Release

on:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_type:
        description: 'リリースの種類 (release: 正式リリース ※mainブランチのみ / prerelease: プレリリース ※mainブランチ以外)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
      custom_version:
        description: 'バージョン番号の上書き (空欄の場合は package.json のバージョンを自動使用)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Branch and Release Type
        env:
          BRANCH: ${{ github.ref_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # 手動実行時は入力値を採用、自動 push 時はブランチ名から自動判別
          if [ -n "$INPUT_RELEASE_TYPE" ]; then
            RELEASE_TYPE="$INPUT_RELEASE_TYPE"
          else
            if [ "$BRANCH" = "main" ]; then
              RELEASE_TYPE="release"
            else
              RELEASE_TYPE="prerelease"
            fi
          fi

          echo "実行ブランチ: $BRANCH"
          echo "リリース種別: $RELEASE_TYPE"

          if [ "$RELEASE_TYPE" = "prerelease" ] && [ "$BRANCH" = "main" ]; then
            echo "::error::プレリリース (prerelease) は main ブランチでは実行できません。開発ブランチ（例: 3.12.0 等）から実行してください。"
            exit 1
          fi

          if [ "$RELEASE_TYPE" = "release" ] && [ "$BRANCH" != "main" ]; then
            echo "::error::正式リリース (release) は main ブランチ以外では実行できません。main ブランチから実行してください。（現在のブランチ: $BRANCH）"
            exit 1
          fi

          echo "RELEASE_TYPE=$RELEASE_TYPE" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version, Tag, and Generate Changelog
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$CUSTOM_VERSION" ]; then
            RAW_VER="$CUSTOM_VERSION"
          else
            RAW_VER=$(node -p "require('./package.json').version")
          fi

          # 先頭に v が無ければ付与
          if [[ "$RAW_VER" == v* ]]; then
            TAG_NAME="$RAW_VER"
            VER_NUM="${RAW_VER#v}"
          else
            TAG_NAME="v$RAW_VER"
            VER_NUM="$RAW_VER"
          fi

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            # プレリリース時はタグ名に -pre を付与 (既に含まれていなければ)
            if [[ "$TAG_NAME" != *-pre* ]]; then
              TAG_NAME="${TAG_NAME}-pre"
            fi
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_title=Mizuna $TAG_NAME (Pre-release)" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_title=Mizuna $TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER_NUM" >> "$GITHUB_OUTPUT"

          # 差分比較対象の直前タグ (PREV_TAG) を決定
          if [ "$RELEASE_TYPE" = "release" ]; then
            # 正式リリースの場合はプレリリースタグを除外し、前回の「正式リリース」タグとの差分を取得
            PREV_TAG=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.prerelease == false and .draft == false and .tag_name != "'"$TAG_NAME"'")][0].tag_name // empty' 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG_NAME" --exclude="*-pre*" --exclude="*-rc*" --exclude="*-beta*" --exclude="*-alpha*" HEAD 2>/dev/null || echo "")
            fi
          else
            # プレリリースの場合は直前のタグ（同名タグ自身は除外）を取得
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG_NAME" HEAD 2>/dev/null || echo "")
          fi

          echo "差分比較ベースタグ (PREV_TAG): ${PREV_TAG:-なし (初回)}"

          {
            echo "## Mizuna $TAG_NAME"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 変更内容 ($PREV_TAG からの差分)"
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)"
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG_NAME}"
            else
              echo "### 変更内容 (直近のコミット)"
              git log -n 30 --no-merges --pretty=format:"- %s (%h)"
              echo ""
            fi
          } > RELEASE_NOTES.md

          # 同名タグが既に存在する場合も現在のコミットへ上書き更新
          git tag -f "$TAG_NAME" HEAD
          git push -f origin "refs/tags/$TAG_NAME"

      - name: Create Git Tag and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
